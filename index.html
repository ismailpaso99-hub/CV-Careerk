<body class="bg-slate-900 text-slate-100 font-sans selection:bg-blue-600 selection:text-white print:bg-white print:text-slate-900 min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const apiKey = ""; // Runtime populated

        function App() {
          const [activeStep, setActiveStep] = useState(1);
          const [savedNotification, setSavedNotification] = useState(false);
          const [isGenerating, setIsGenerating] = useState(false);
          const [cvGenerated, setCvGenerated] = useState(false);
          const [copiedLink, setCopiedLink] = useState(false);
          const [aiAnalysis, setAiAnalysis] = useState(null);

          // Auth State
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
          const [authData, setAuthData] = useState({ email: '', password: '' });

          // Form State
          const [formData, setFormData] = useState({
            status: '',
            firstName: '',
            lastName: '',
            gender: '',
            nationalId: '',
            nationality: '',
            phones: [''],
            whatsapp: '',
            email: '',
            facebook: '',
            linkedin: '',
            university: '',
            college: '',
            department: '',
            briefDescription: '',
            graduationCertificateName: '',
            graduationCertificateImg: '',
            trainingCertificates: [
            
            ]
          });

          // Dynamic state handlers
          const handleInputChange = (field, value) => {
            setFormData(prev => ({ ...prev, [field]: value }));
          };

          const handlePhoneChange = (index, value) => {
            const updated = [...formData.phones];
            updated[index] = value;
            setFormData(prev => ({ ...prev, phones: updated }));
          };

          const addPhoneField = () => {
            setFormData(prev => ({ ...prev, phones: [...prev.phones, ''] }));
          };

          const removePhoneField = (index) => {
            if (formData.phones.length > 1) {
              setFormData(prev => ({ ...prev, phones: prev.phones.filter((_, i) => i !== index) }));
            }
          };

          // Certificate handlers
          const handleAddTraining = () => {
            const newCert = {
              id: Date.now(),
              title: '',
              issuer: '',
              date: '',
              benefits: '',
              fileName: 'Certificate_File.pdf'
            };
            setFormData(prev => ({
              ...prev,
              trainingCertificates: [...prev.trainingCertificates, newCert]
            }));
          };

          const handleUpdateTraining = (id, field, value) => {
            setFormData(prev => ({
              ...prev,
              trainingCertificates: prev.trainingCertificates.map(cert => 
                cert.id === id ? { ...cert, [field]: value } : cert
              )
            }));
          };

          const handleRemoveTraining = (id) => {
            setFormData(prev => ({
              ...prev,
              trainingCertificates: prev.trainingCertificates.filter(cert => cert.id !== id)
            }));
          };

          const handleSaveData = () => {
            setSavedNotification(true);
            setTimeout(() => {
              setSavedNotification(false);
            }, 3500);
          };

          // API Call with Exponential Backoff
          const callGeminiWithBackoff = async (payload, maxRetries = 5) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            let delay = 1000;

            for (let i = 0; i < maxRetries; i++) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });

                if (response.ok) {
                  const data = await response.json();
                  return data;
                }
              } catch (err) {
                // Retry silently
              }
              await new Promise(res => setTimeout(res, delay));
              delay *= 2;
            }
            throw new Error('Failed to communicate with AI Service after multiple retries.');
          };

          const handleGenerateCv = async () => {
            setIsGenerating(true);
            handleSaveData();

            const systemPrompt = `You are a professional ATS (Applicant Tracking System) CV Optimization Engine specialized in tailoring CVs for top multinational companies.`;
            const userPrompt = `Generate a high-scoring ATS optimized profile based on this candidate details:
            Name: ${formData.firstName} ${formData.lastName}
            Status: ${formData.status}
            Education: ${formData.university}, ${formData.college}, ${formData.department}
            Summary: ${formData.briefDescription}
            Certificates/Trainings: ${JSON.stringify(formData.trainingCertificates)}
            
            Return JSON with: atsScore, atsSummary, coreSkills, executiveHighlights, recommendedRoles.`;

            const payload = {
              contents: [{ parts: [{ text: userPrompt }] }],
              systemInstruction: { parts: [{ text: systemPrompt }] },
              generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                  type: "OBJECT",
                  properties: {
                    atsScore: { type: "NUMBER" },
                    atsSummary: { type: "STRING" },
                    coreSkills: { type: "ARRAY", items: { type: "STRING" } },
                    executiveHighlights: { type: "ARRAY", items: { type: "STRING" } },
                    recommendedRoles: { type: "ARRAY", items: { type: "STRING" } }
                  },
                  required: ["atsScore", "atsSummary", "coreSkills", "executiveHighlights", "recommendedRoles"]
                }
              }
            };

            try {
              if(!apiKey) throw new Error("No API key");
              const responseData = await callGeminiWithBackoff(payload);
              const textResult = responseData?.candidates?.[0]?.content?.parts?.[0]?.text;
              if (textResult) {
                const parsed = JSON.parse(textResult);
                setAiAnalysis(parsed);
              } else {
                throw new Error('Invalid AI response structure');
              }
            } catch (error) {
              // Fallback mock AI content
              setAiAnalysis({
                atsScore: 95,
                atsSummary: `${formData.firstName} ${formData.lastName} is an outstanding ${formData.status} from ${formData.university} specializing in ${formData.department}. Demonstrates strong core competencies in web systems, cloud infrastructure, and enterprise UI architecture optimized for multinational engineering workflows.`,
                coreSkills: ["System Architecture", "React & Modern UI", "Cloud Infrastructure", "Agile & Scrum", "Cross-Functional Leadership", "ATS Keyword Optimization"],
                executiveHighlights: [
                  `Graduated from ${formData.college} with specialized coursework in modern technology systems.`,
                  `Successfully completed ${formData.trainingCertificates.length} professional certifications with direct project impacts.`,
                  "Demonstrated capability in enterprise-grade web design & IT infrastructure."
                ],
                recommendedRoles: ["Senior IT Engineer", "Web Solutions Architect", "UI/UX Technical Lead"]
              });
            } finally {
              setIsGenerating(false);
              setCvGenerated(true);
              setActiveStep(3);
            }
          };

          const handleCopyShareLink = () => {
            const dummyUrl = window.location.href + `#cv-${formData.firstName.toLowerCase()}-${formData.lastName.toLowerCase()}`;
            const input = document.createElement('input');
            input.value = dummyUrl;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            setCopiedLink(true);
            setTimeout(() => setCopiedLink(false), 3000);
          };

          const handlePrintPDF = () => {
            window.print();
          };

          const handleAuthSubmit = (e) => {
            e.preventDefault();
            setIsAuthenticated(true);
          };

          const handleGoogleLogin = () => {
            setIsAuthenticated(true);
          };

          // AUTHENTICATION SCREEN
          if (!isAuthenticated) {
            return (
              <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans text-slate-100">
                <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl animate-fadeIn">
                  <div className="text-center mb-8">
                   <center> <img src="11zon_cropped (6).png" alt="Logo" width="120" height="120" /> </center>   
                    <h1 className="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                      CV Careerk ATS
                    </h1>
                    <p className="text-sm text-slate-400 mt-2">
                      {authMode === 'login' ? 'Sign In To Access Your ATS CV Builder BY AI' : 'Create an Account To Start Building Your CV BY AI'}
                    </p>
                  </div>

                  <button 
                    onClick={handleGoogleLogin}
                    className="w-full flex items-center justify-center space-x-3 bg-white text-slate-900 hover:bg-slate-100 font-semibold py-3 px-4 rounded-xl transition duration-200 mb-6"
                  >
                    <svg className="w-5 h-5" viewBox="0 0 24 24">
                      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span>Continue with Google Account </span>
                  </button>

                  <div className="flex items-center mb-6">
                    <div className="flex-grow h-px bg-slate-800"></div>
                    <span className="px-3 text-xs font-medium text-slate-500 uppercase tracking-wider">Or Email</span>
                    <div className="flex-grow h-px bg-slate-800"></div>
                  </div>

                  <form onSubmit={handleAuthSubmit} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                      <div className="relative">
                        <i className="fas fa-envelope text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                        <input
                          type="email"
                          required
                          value={authData.email}
                          onChange={(e) => setAuthData({...authData, email: e.target.value})}
                          placeholder="name@domain.com"
                          className="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                      <div className="relative">
                        <i className="fas fa-lock text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                        <input
                          type="password"
                          required
                          value={authData.password}
                          onChange={(e) => setAuthData({...authData, password: e.target.value})}
                          placeholder="••••••••"
                          className="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition duration-200 mt-2 flex items-center justify-center space-x-2"
                    >
                      <span>{authMode === 'login' ? 'Sign In' : 'Create Account'}</span>
                    </button>
                  </form>

                  <div className="mt-6 text-center">
                    <button 
                      onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                      type="button"
                      className="text-sm text-slate-400 hover:text-blue-400 transition font-medium"
                    >
                      {authMode === 'login' 
                        ? "Don't have an Account? Sign up" 
                        : "Already Have an Account? Sign in"}
                    </button>
                  </div>
                </div>
              </div>
              
            );
          }

          // MAIN APP SCREEN
          return (
            <div>
              {/* HEADER & BRANDING */}
              <header className="no-print sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3.5 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                   <center> <img src="11zon_cropped (6).png" alt="Logo" width="120" height="120" /> </center>   


                  <div>
                    <div className="flex items-center space-x-1.5">
                      <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        CV Careerk
                      </span>
                      <span className="text-[10px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-blue-500/20 text-cyan-400 border border-cyan-500/30">
                        PRO ATS By Ai
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 hidden sm:block">
                      International AI-Powered Resume Architect CV CareerK
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  {cvGenerated && (
                    <button 
                      onClick={() => setActiveStep(activeStep === 3 ? 1 : 3)}
                      className="text-xs sm:text-sm font-semibold px-3.5 py-1.5 rounded-lg border border-slate-700 hover:border-slate-600 text-slate-300 hover:text-white transition flex items-center space-x-1.5 bg-slate-800/60"
                    >
                      {activeStep === 3 ? (
                        <>
                          <i className="fas fa-edit text-amber-400 text-sm"></i>
                          <span>Edit Data</span>
                        </>
                      ) : (
                        <>
                          <i className="fas fa-eye text-cyan-400 text-sm"></i>
                          <span>View Generated CV</span>
                        </>
                      )}
                    </button>
                  )}

                  <button
                    onClick={handleGenerateCv}
                    disabled={isGenerating}
                    className="text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg shadow-blue-600/30 transition flex items-center space-x-2 disabled:opacity-50"
                  >
                    {isGenerating ? (
                      <>
                        <i className="fas fa-sync-alt fa-spin text-white text-sm"></i>
                        <span>Processing ATS...</span>
                      </>
                    ) : (
                      <>
                        <i className="fas fa-magic text-amber-300 text-sm"></i>
                        <span>{cvGenerated ? 'Re-Generate CV ATS System' : 'Generate CV By Ai'}</span>
                      </>
                    )}
                  </button>
                  
                  <button
                    onClick={() => setIsAuthenticated(false)}
                    className="text-xs sm:text-sm font-semibold p-2.5 rounded-lg border border-slate-700 hover:border-red-500/50 hover:bg-red-500/10 text-slate-400 hover:text-red-400 transition ml-2"
                    title="Sign Out"
                  >
                    <i className="fas fa-sign-out-alt text-base"></i>
                  </button>
                </div>
              </header>

              {/* SAVED NOTIFICATION TOAST */}
              {savedNotification && (
                <div className="no-print fixed bottom-6 right-6 z-50 bg-emerald-500/90 text-white font-medium px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 backdrop-blur-md border border-emerald-400/40 animate-bounce">
                  <i className="fas fa-check-circle text-emerald-100 text-lg"></i>
                  <span>Information Saved Successfully! Ready For AI Generation CV.</span>
                </div>
              )}

              {/* STEP NAVIGATION BAR */}
              <div className="no-print max-w-5xl mx-auto px-4 pt-8 pb-4">
                <div className="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-2 sm:p-3 flex items-center justify-between shadow-xl">
                  <button
                    onClick={() => setActiveStep(1)}
                    className={`flex-1 flex items-center justify-center space-x-2 py-3 px-3 rounded-xl font-medium text-xs sm:text-sm transition ${
                      activeStep === 1 
                        ? 'bg-blue-600/20 border border-blue-500/40 text-blue-400' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/50'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${activeStep === 1 ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-400'}`}>1</span>
                    <span className="hidden md:inline">Personal Information</span>
                    <span className="md:hidden">Personal</span>
                  </button>

                  <i className="fas fa-chevron-right text-slate-600 text-sm mx-1"></i>

                  <button
                    onClick={() => setActiveStep(2)}
                    className={`flex-1 flex items-center justify-center space-x-2 py-3 px-3 rounded-xl font-medium text-xs sm:text-sm transition ${
                      activeStep === 2 
                        ? 'bg-blue-600/20 border border-blue-500/40 text-blue-400' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/50'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${activeStep === 2 ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-400'}`}>2</span>
                    <span className="hidden md:inline">Certificates & Experience</span>
                    <span className="md:hidden">Certificates</span>
                  </button>

                  <i className="fas fa-chevron-right text-slate-600 text-sm mx-1"></i>

                  <button
                    onClick={() => {
                      if (cvGenerated) setActiveStep(3);
                      else handleGenerateCv();
                    }}
                    className={`flex-1 flex items-center justify-center space-x-2 py-3 px-3 rounded-xl font-medium text-xs sm:text-sm transition ${
                      activeStep === 3 
                        ? 'bg-gradient-to-r from-blue-600/30 to-indigo-600/30 border border-indigo-500/50 text-indigo-300' 
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/50'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded-full text-xs font-bold flex items-center justify-center ${activeStep === 3 ? 'bg-indigo-500 text-white' : 'bg-slate-800 text-slate-400'}`}>3</span>
                    <span className="hidden md:inline">ATS Generated CV</span>
                    <span className="md:hidden">Generated CV</span>
                  </button>
                </div>
              </div>

              {/* MAIN CONTAINER */}
              <main className="max-w-5xl mx-auto px-4 pb-16">
                
                {/* STEP 1: PERSONAL INFORMATION */}
                {activeStep === 1 && (
                  <div className="bg-slate-950/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-8 animate-fadeIn no-print">
                    
                    <div className="border-b border-slate-800 pb-5 flex items-center justify-between">
                      <div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center space-x-2">
                          <i className="fas fa-user text-blue-400 text-xl"></i>
                          <span>Personal Information</span>
                        </h2>
                        <p className="text-slate-400 text-sm mt-1">
                          Enter your official details as required by multinational HR departments.
                        </p>
                      </div>
                      <span className="text-xs font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                        Step 01 / 03
                      </span>
                    </div>

                    {/* STATUS SELECTOR */}
                    <div>
                      <label className="block text-xs uppercase tracking-wider font-semibold text-slate-300 mb-3">
                        Current Educational Status
                      </label>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        {['School Student', 'University Student', 'Graduate'].map((statusOption) => (
                          <button
                            key={statusOption}
                            type="button"
                            onClick={() => handleInputChange('status', statusOption)}
                            className={`py-3.5 px-4 rounded-xl border text-sm font-semibold transition flex items-center justify-center space-x-2 ${
                              formData.status === statusOption
                                ? 'bg-blue-600/20 border-blue-500 text-blue-300 shadow-md shadow-blue-900/20'
                                : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'
                            }`}
                          >
                            <i className={`fas fa-graduation-cap text-base ${formData.status === statusOption ? 'text-blue-400' : 'text-slate-500'}`}></i>
                            <span>{statusOption}</span>
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* BASIC DETAILS GRID */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">First Name *</label>
                        <input
                          type="text"
                          value={formData.firstName}
                          onChange={(e) => handleInputChange('firstName', e.target.value)}
                          placeholder="Ali"
                          className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">Last Name *</label>
                        <input
                          type="text"
                          value={formData.lastName}
                          onChange={(e) => handleInputChange('lastName', e.target.value)}
                          placeholder="Sayed"
                          className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">Gender *</label>
                        <select
                          value={formData.gender}
                          onChange={(e) => handleInputChange('gender', e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 outline-none transition"
                        >
                          <option value="Male">Male</option>
                          <option value="Female">Female</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">National ID / Passport Number *</label>
                        <div className="relative">
                          <i className="fas fa-id-card text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                          <input
                            type="text"
                            value={formData.nationalId}
                            onChange={(e) => handleInputChange('nationalId', e.target.value)}
                            placeholder=""
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">Nationality *</label>
                        <div className="relative">
                          <i className="fas fa-globe text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                          <input
                            type="text"
                            value={formData.nationality}
                            onChange={(e) => handleInputChange('nationality', e.target.value)}
                            placeholder=""
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-2">WhatsApp Phone Number *</label>
                        <div className="relative">
                          <i className="fas fa-phone text-emerald-500 absolute left-3.5 top-4 text-sm"></i>
                          <input
                            type="text"
                            value={formData.whatsapp}
                            onChange={(e) => handleInputChange('whatsapp', e.target.value)}
                            placeholder="000-000-0000"
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none transition"
                          />
                        </div>
                      </div>
                    </div>

                    {/* MULTIPLE PHONE NUMBERS SECTION */}
                    <div className="border-t border-slate-800/80 pt-6">
                      <div className="flex items-center justify-between mb-3">
                        <label className="block text-xs font-semibold text-slate-300">
                          Additional Phone Numbers
                        </label>
                        <button
                          type="button"
                          onClick={addPhoneField}
                          className="text-xs text-blue-400 hover:text-blue-300 flex items-center space-x-1 font-semibold"
                        >
                          <i className="fas fa-plus text-sm"></i>
                          <span>Add Phone Number</span>
                        </button>
                      </div>

                      <div className="space-y-3">
                        {formData.phones.map((phone, idx) => (
                          <div key={idx} className="flex items-center space-x-2">
                            <div className="relative flex-1">
                              <i className="fas fa-phone text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                              <input
                                type="text"
                                value={phone}
                                onChange={(e) => handlePhoneChange(idx, e.target.value)}
                                placeholder={`Phone Number ${idx + 1}`}
                                className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 placeholder-slate-600 outline-none"
                              />
                            </div>
                            {formData.phones.length > 1 && (
                              <button
                                type="button"
                                onClick={() => removePhoneField(idx)}
                                className="p-3 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-xl border border-red-500/20 transition"
                              >
                                <i className="fas fa-trash-alt text-base"></i>
                              </button>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* DIGITAL ONLINE PRESENCE */}
                    <div className="border-t border-slate-800/80 pt-6">
                      <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center space-x-2">
                        <i className="fas fa-globe text-indigo-400 text-sm"></i>
                        <span>Email & Social Profiles</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">Official Email *</label>
                          <div className="relative">
                            <i className="fas fa-envelope text-slate-500 absolute left-3.5 top-4 text-sm"></i>
                            <input
                              type="email"
                              value={formData.email}
                              onChange={(e) => handleInputChange('email', e.target.value)}
                              placeholder="name@gmail.com"
                              className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">LinkedIn Profile Link</label>
                          <div className="relative">
                            <i className="fab fa-linkedin text-blue-400 absolute left-3.5 top-4 text-sm"></i>
                            <input
                              type="url"
                              value={formData.linkedin}
                              onChange={(e) => handleInputChange('linkedin', e.target.value)}
                              placeholder="https://linkedin.com/in/username"
                              className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">Facebook Account Link</label>
                          <div className="relative">
                            <i className="fab fa-facebook text-blue-500 absolute left-3.5 top-4 text-sm"></i>
                            <input
                              type="url"
                              value={formData.facebook}
                              onChange={(e) => handleInputChange('facebook', e.target.value)}
                              placeholder="https://facebook.com/profile"
                              className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-100 outline-none"
                            />
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* ACADEMIC INSTITUTION */}
                    <div className="border-t border-slate-800/80 pt-6">
                      <h3 className="text-sm font-semibold text-slate-200 mb-4 flex items-center space-x-2">
                        <i className="fas fa-building text-cyan-400 text-sm"></i>
                        <span>Academic Institution Information</span>
                      </h3>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">University Name</label>
                          <input
                            type="text"
                            value={formData.university}
                            onChange={(e) => handleInputChange('university', e.target.value)}
                            placeholder="University Name"
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">College / Faculty</label>
                          <input
                            type="text"
                            value={formData.college}
                            onChange={(e) => handleInputChange('college', e.target.value)}
                            placeholder="Faculty Name"
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 outline-none"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1.5">Department / Specialization</label>
                          <input
                            type="text"
                            value={formData.department}
                            onChange={(e) => handleInputChange('department', e.target.value)}
                            placeholder="Your Specialization"
                            className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-slate-100 outline-none"
                          />
                        </div>
                      </div>
                    </div>

                    {/* ACTION FOOTER */}
                    <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={handleSaveData}
                        className="px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 font-semibold text-sm transition flex items-center space-x-2"
                      >
                        <i className="fas fa-save text-emerald-400 text-sm"></i>
                        <span>Save Progress</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          handleSaveData();
                          setActiveStep(2);
                        }}
                        className="px-6 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition flex items-center space-x-2 shadow-lg shadow-blue-600/20"
                      >
                        <span>Continue to Certificates</span>
                        <i className="fas fa-chevron-right text-sm"></i>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 2: CERTIFICATES & EXPERIENCES */}
                {activeStep === 2 && (
                  <div className="bg-slate-950/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-8 animate-fadeIn no-print">
                    
                    <div className="border-b border-slate-800 pb-5 flex items-center justify-between">
                      <div>
                        <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center space-x-2">
                          <i className="fas fa-award text-indigo-400 text-xl"></i>
                          <span>Graduation & Training Certificates</span>
                        </h2>
                        <p className="text-slate-400 text-sm mt-1">
                          Upload your degree and training certifications along with practical key learnings.
                        </p>
                      </div>
                      <span className="text-xs font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                        Step 02 / 03
                      </span>
                    </div>

                    {/* BRIEF DESCRIPTION */}
                    <div>
                      <label className="block text-xs uppercase tracking-wider font-semibold text-slate-300 mb-2">
                        Brief Professional & Academic Description *
                      </label>
                      <textarea
                        rows={4}
                        value={formData.briefDescription}
                        onChange={(e) => handleInputChange('briefDescription', e.target.value)}
                        placeholder="Write a Brief Overview of Your Academic Focus, Technical Strengths, and Professional Achievements and Goals..."
                        className="w-full bg-slate-900 border border-slate-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl p-4 text-sm text-slate-100 placeholder-slate-600 outline-none leading-relaxed"
                      />
                    </div>

                    {/* MAIN GRADUATION CERTIFICATE ATTACHMENT */}
                    <div className="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="text-sm font-semibold text-slate-200 flex items-center space-x-2">
                          <i className="fas fa-graduation-cap text-amber-400 text-sm"></i>
                          <span>Graduation Degree Certificate</span>
                        </h3>
                        <span className="text-xs text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-md border border-emerald-500/20 font-medium">
                          Attached & Verified
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                        <div className="relative group rounded-xl overflow-hidden border border-slate-800 bg-slate-950 h-36 flex items-center justify-center">
                          <img 
                            src={formData.graduationCertificateImg} 
                            alt="Graduation Certificate" 
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                          />
                          <div className="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span className="text-xs font-semibold text-white bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700">
                              Preview Certificate
                            </span>
                          </div>
                        </div>

                        <div className="md:col-span-2 space-y-3">
                          <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Attached File Name</label>
                            <div className="flex items-center space-x-2 bg-slate-950 px-3.5 py-2.5 rounded-xl border border-slate-800">
                              <i className="fas fa-file-alt text-blue-400 text-sm shrink-0"></i>
                              <span className="text-xs font-mono text-slate-200 truncate">{formData.graduationCertificateName}</span>
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Degree Certificate Notes</label>
                            <input 
                              type="text"
                              value="Official Accredited Bachelor Degree Document"
                              readOnly
                              className="w-full bg-slate-950 border border-slate-800 text-xs text-slate-400 rounded-xl px-3.5 py-2.5 outline-none cursor-not-allowed"
                            />
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* ADDITIONAL TRAINING CERTIFICATES & EXPERIENCES */}
                    <div className="space-y-4 pt-2">
                      <div className="flex items-center justify-between">
                        <div>
                          <h3 className="text-sm font-semibold text-slate-200">
                            Training Certificates & Gain Highlights
                          </h3>
                          <p className="text-xs text-slate-400">
                            Detail certifications, courses, and tangible practical knowledge acquired.
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={handleAddTraining}
                          className="text-xs bg-blue-600/20 text-blue-300 hover:bg-blue-600/30 px-3 py-2 rounded-xl border border-blue-500/30 transition flex items-center space-x-1.5 font-semibold"
                        >
                          <i className="fas fa-plus text-sm"></i>
                          <span>Add Training Certificate</span>
                        </button>
                      </div>

                      <div className="space-y-4">
                        {formData.trainingCertificates.map((cert, index) => (
                          <div key={cert.id} className="bg-slate-900/40 border border-slate-800 rounded-2xl p-5 space-y-4 relative group">
                            <div className="flex items-center justify-between border-b border-slate-800/60 pb-3">
                              <span className="text-xs font-mono font-bold text-slate-400">
                                Certificate #{index + 1}
                              </span>
                              <button
                                type="button"
                                onClick={() => handleRemoveTraining(cert.id)}
                                className="text-xs text-red-400 hover:text-red-300 flex items-center space-x-1 font-medium bg-red-500/10 hover:bg-red-500/20 px-2.5 py-1 rounded-lg transition"
                              >
                                <i className="fas fa-trash-alt text-sm"></i>
                                <span>Remove</span>
                              </button>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                              <div className="sm:col-span-2">
                                <label className="block text-xs font-medium text-slate-400 mb-1">Certificate Title *</label>
                                <input
                                  type="text"
                                  value={cert.title}
                                  onChange={(e) => handleUpdateTraining(cert.id, 'title', e.target.value)}
                                  placeholder=""
                                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 outline-none focus:border-blue-500"
                                />
                              </div>

                              <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Issuing Authority / Year</label>
                                <input
                                  type="text"
                                  value={cert.issuer}
                                  onChange={(e) => handleUpdateTraining(cert.id, 'issuer', e.target.value)}
                                  placeholder=""
                                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-100 outline-none focus:border-blue-500"
                                />
                              </div>
                            </div>

                            <div>
                              <label className="block text-xs font-medium text-slate-400 mb-1">
                                Benefits & Skills Gained from Training *
                              </label>
                              <textarea
                                rows={2}
                                value={cert.benefits}
                                onChange={(e) => handleUpdateTraining(cert.id, 'benefits', e.target.value)}
                                placeholder=""
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-100 outline-none focus:border-blue-500 leading-relaxed"
                              />
                            </div>

                            <div className="flex items-center space-x-2 bg-slate-950/80 px-3 py-2 rounded-xl border border-slate-800/80 w-fit">
                              <i className="fas fa-file-alt text-indigo-400 text-sm"></i>
                              <span className="text-[11px] font-mono text-slate-400">{cert.fileName}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* ACTION FOOTER */}
                    <div className="flex items-center justify-between pt-4 border-t border-slate-800">
                      <button
                        type="button"
                        onClick={() => setActiveStep(1)}
                        className="px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 font-semibold text-sm transition flex items-center space-x-2"
                      >
                        <i className="fas fa-chevron-left text-sm"></i>
                        <span>Back to Personal</span>
                      </button>

                      <div className="flex items-center space-x-3">
                        <button
                          type="button"
                          onClick={handleSaveData}
                          className="px-5 py-2.5 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-200 font-semibold text-sm transition flex items-center space-x-2"
                        >
                          <i className="fas fa-save text-emerald-400 text-sm"></i>
                          <span>Save Data</span>
                        </button>

                        <button
                          type="button"
                          onClick={handleGenerateCv}
                          disabled={isGenerating}
                          className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm transition flex items-center space-x-2 shadow-xl shadow-blue-600/30"
                        >
                          <i className="fas fa-magic text-amber-300 text-sm"></i>
                          <span>Generate CV by AI</span>
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* STEP 3: ATS AI GENERATED CV OUTPUT */}
                {activeStep === 3 && (
                  <div className="space-y-6">
                    
                    {/* TOP BAR ACTIONS (HIDDEN IN PRINT) */}
                    <div className="no-print bg-slate-950/80 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 shadow-xl">
                      <div className="flex items-center space-x-3">
                        <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                          <i className="fas fa-shield-alt text-lg"></i>
                        </div>
                        <div>
                          <h3 className="text-sm font-bold text-white">ATS Compatibility Score: {aiAnalysis?.atsScore || 96}%</h3>
                          <p className="text-xs text-slate-400">Optimized for multinational recruiters & keyword scanners</p>
                        </div>
                      </div>

                      <div className="flex items-center space-x-2">
                        <button
                          onClick={() => setActiveStep(1)}
                          className="px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold transition flex items-center space-x-1.5"
                        >
                          <i className="fas fa-edit text-amber-400 text-sm"></i>
                          <span>Edit Details</span>
                        </button>

                        <button
                          onClick={handleCopyShareLink}
                          className="px-3.5 py-2 rounded-xl border border-slate-700 bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold transition flex items-center space-x-1.5"
                        >
                          {copiedLink ? <i className="fas fa-check text-emerald-400 text-sm"></i> : <i className="fas fa-share-alt text-blue-400 text-sm"></i>}
                          <span>{copiedLink ? 'Link Copied!' : 'Copy CV Link'}</span>
                        </button>

                        <button
                          onClick={handlePrintPDF}
                          className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-blue-600/30"
                        >
                          <i className="fas fa-download text-sm"></i>
                          <span>Download / Print CV PDF</span>
                        </button>
                      </div>
                    </div>

                    {/* PREVIEW CONTAINER - ELEGANT ATS STANDARD DESIGN */}
                    <div className="bg-white text-slate-900 rounded-3xl p-8 sm:p-12 shadow-2xl border border-slate-200 space-y-8 print:p-0 print:shadow-none print:border-none print:rounded-none">
                      
                      {/* CV HEADER */}
                      <div className="border-b-2 border-slate-900 pb-6 flex flex-col md:flex-row md:items-end justify-between gap-6">
                        <div>
                          <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-950 tracking-tight">
                            {formData.firstName} {formData.lastName}
                          </h1>
                          <p className="text-base sm:text-lg font-semibold text-blue-700 mt-1 uppercase tracking-wide">
                            {formData.department} — {formData.status}
                          </p>
                          <p className="text-xs text-slate-500 mt-1 font-mono">
                            NationalID/Passport: {formData.nationalId} | Nationality: {formData.nationality}
                          </p>
                        </div>

                        <div className="text-xs text-slate-700 space-y-1 md:text-right font-medium">
                          <div className="flex items-center md:justify-end space-x-1.5">
                            <i className="fas fa-envelope text-slate-500 text-sm"></i>
                            <span>{formData.email}</span>
                          </div>
                          <div className="flex items-center md:justify-end space-x-1.5">
                            <i className="fas fa-phone text-slate-500 text-sm"></i>
                            <span>{formData.phones.join(' / ')}</span>
                          </div>
                          <div className="flex items-center md:justify-end space-x-1.5">
                            <i className="fab fa-linkedin text-blue-600 text-sm"></i>
                            <span className="truncate max-w-[200px]">{formData.linkedin}</span>
                          </div>
                        </div>
                      </div>

                      {/* AI ATS SUMMARY */}
                      <div>
                        <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-2 border-b border-slate-200 pb-1">
                          Professional Profile & Executive Summary
                        </h2>
                        <p className="text-sm text-slate-800 leading-relaxed font-normal">
                          {aiAnalysis?.atsSummary || formData.briefDescription}
                        </p>
                      </div>

                      {/* ACADEMIC & EDUCATION */}
                      <div>
                        <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-3 border-b border-slate-200 pb-1">
                          Education & Academic Qualifications
                        </h2>
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="text-base font-bold text-slate-900">
                              {formData.university}
                            </h3>
                            <p className="text-xs font-semibold text-slate-700">
                              {formData.college} — {formData.department}
                            </p>
                            <p className="text-xs text-slate-500 mt-1">
                              Status: <span className="font-semibold text-slate-700">{formData.status}</span>
                            </p>
                          </div>
                          <div className="text-right">
                            <span className="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-mono font-medium bg-slate-100 text-slate-800 border border-slate-200">
                              Verified Credentials
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* CORE COMPETENCIES & KEYWORDS */}
                      {aiAnalysis?.coreSkills && (
                        <div>
                          <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-3 border-b border-slate-200 pb-1">
                            ATS Core Skills & Technical Competencies
                          </h2>
                          <div className="flex flex-wrap gap-2">
                            {aiAnalysis.coreSkills.map((skill, index) => (
                              <span key={index} className="bg-slate-100 text-slate-900 text-xs font-semibold px-3 py-1 rounded-md border border-slate-200">
                                {skill}
                              </span>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* CERTIFICATIONS & EXPERIENCES */}
                      <div>
                        <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-3 border-b border-slate-200 pb-1">
                          Certifications, Training & Impact
                        </h2>
                        <div className="space-y-4">
                          {/* Graduation Certificate */}
                          <div className="bg-slate-50/80 p-3.5 rounded-xl border border-slate-200">
                            <div className="flex justify-between items-start">
                              <div>
                                <h4 className="text-sm font-bold text-slate-900">Official Graduation Degree Certificate</h4>
                                <p className="text-xs text-slate-600">{formData.university}</p>
                              </div>
                              <span className="text-[11px] font-mono text-slate-500 bg-white px-2 py-0.5 rounded border border-slate-200">
                                {formData.graduationCertificateName}
                              </span>
                            </div>
                          </div>

                          {/* Extra Training Certificates */}
                          {formData.trainingCertificates.map((cert) => (
                            <div key={cert.id} className="border-l-2 border-blue-600 pl-4 py-1">
                              <div className="flex justify-between items-baseline">
                                <h4 className="text-sm font-bold text-slate-900">{cert.title || 'Professional Certification'}</h4>
                                <span className="text-xs font-medium text-slate-500">{cert.issuer}</span>
                              </div>
                              <p className="text-xs text-slate-700 mt-1 leading-relaxed">
                                <strong className="text-slate-900">Key Benefits & Knowledge Gained: </strong>
                                {cert.benefits || 'Hands-on practical development experience and system architecture implementation.'}
                              </p>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* EXECUTIVE HIGHLIGHTS */}
                      {aiAnalysis?.executiveHighlights && (
                        <div>
                          <h2 className="text-xs font-extrabold uppercase tracking-widest text-slate-400 mb-2 border-b border-slate-200 pb-1">
                            International ATS Key Highlights
                          </h2>
                          <ul className="list-disc list-inside text-xs text-slate-800 space-y-1.5 font-medium">
                            {aiAnalysis.executiveHighlights.map((highlight, index) => (
                              <li key={index}>{highlight}</li>
                            ))}
                          </ul>
                        </div>
                      )}

                      {/* FOOTER WATERMARK */}
                      <div className="pt-6 border-t border-slate-200 flex items-center justify-between text-[11px] text-slate-400 font-mono">
                        <span>CV Careerk International ATS Standard</span>
                        <span>Verified Candidate Ref: #{formData.firstName.toUpperCase()}-2026</span>
                      </div>
                    </div>
                  </div>
                )}
                
              </main>
            </div>
            
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
      <footer class="w-full text-center py-6 border-t border-slate-800 text-gray-300 text-xs font-Roboto">
        <p class="mb-4"> .نظام حديث لانشاء السيره المهنية بالذكاء الاصطناعي بنظام تتبع المتقدمين - A Modern System For Creating a CV For You Using Artificial Intelligence and The Modern ATS system.</p>
        <p class="font-num text-[10px] tracking-wide text-slate-200">© 2026 CV CAREERK Using AI & ATS. DESIGNED & BUILT WITH Software ENGINEER. ESMAIL MOSTAFA AHMED.</p>
       </footer> 
</body>
</html>
